<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2529">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Чайна зала</title>
<style>
:root{
  --bg:#0f2529;--bg2:#153238;--line:#2c5359;--text:#e8efe9;--dim:#9db8b0;
  --jade:#a9d6c0;--lac:#b3283c;--paper:#eee7d5;--ink:#2b2219;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,#10282d,#0b1d21);color:var(--text);font:16px/1.45 var(--sans);min-height:100vh;min-height:100dvh}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
[hidden]{display:none!important}
.screen{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh}

/* кнопки */
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;background:var(--jade);color:#0d2226;font-weight:700;font-size:17px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}

/* чіпи */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{--cbg:rgba(169,214,192,.12);--cbd:rgba(169,214,192,.35);--cfg:var(--text);
  display:inline-block;padding:3px 10px;border-radius:999px;background:var(--cbg);border:1px solid var(--cbd);color:var(--cfg);font-size:14px;line-height:1.5}
.chip.hid{border-style:dashed;letter-spacing:.12em}
.chip.flip{animation:flip .5s}
@keyframes flip{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}

/* назва */
.title-screen{display:flex;flex-direction:column;justify-content:center;padding:32px 22px calc(28px + env(safe-area-inset-bottom));gap:26px}
.fan{position:relative;height:150px;margin:0 auto;width:220px}
.fan .card{position:absolute;bottom:0;left:50%;width:100px;min-height:136px;margin-left:-50px;transform-origin:50% 120%;pointer-events:none}
.fan .card:nth-child(1){transform:rotate(-16deg)}
.fan .card:nth-child(2){transform:rotate(0)}
.fan .card:nth-child(3){transform:rotate(16deg)}
h1{font:700 46px/1.05 var(--serif);margin:0;text-align:center;letter-spacing:.01em}
.tagline{margin:8px 0 0;text-align:center;color:var(--dim)}
.menu-btns{display:flex;flex-direction:column;gap:10px}
.best{text-align:center;color:var(--dim);font-size:14px;margin:0}

/* HUD */
.hud{position:sticky;top:0;z-index:5;background:rgba(15,37,41,.95);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.hud-row{display:flex;align-items:center;gap:10px}
.hearts{font-size:22px;letter-spacing:2px;color:var(--lac);flex:1}
.hearts .lost{color:#3d5f64}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.streak{color:#e0a45f;font-size:14px}
.mini{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:14px;cursor:pointer}
.bar{height:5px;background:#21444a;border-radius:3px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--jade);width:0;transition:width .4s}
.hud-sub{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:4px}

/* гість */
.visitor{--cbg:rgba(43,34,25,.07);--cbd:rgba(43,34,25,.4);--cfg:var(--ink);
  margin:14px;padding:16px 16px 20px;border-radius:16px;background:var(--paper);color:var(--ink);position:relative;
  box-shadow:0 12px 26px rgba(0,0,0,.4);outline:1px solid rgba(43,34,25,.3);outline-offset:-7px;overflow:hidden}
.v-top{display:flex;align-items:center;gap:12px}
.v-av{font-size:40px;line-height:1}
.v-name{flex:1;min-width:0}
.v-name b{display:block;font:700 19px/1.2 var(--serif)}
.v-say{display:block;font-style:italic;font-family:var(--serif);font-size:15px;opacity:.8}
.cups{font-size:20px;white-space:nowrap}
.cups .lost{opacity:.2;filter:grayscale(1)}
.visitor .chip{--cbg:rgba(43,34,25,.07);--cbd:rgba(43,34,25,.45);--cfg:var(--ink);color:var(--ink)}
.reqlist{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.reqlist li{display:flex;gap:10px;align-items:center;font-size:17px;line-height:1.3}
.reqlist .n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(43,34,25,.5);display:inline-flex;align-items:center;justify-content:center;font:700 13px var(--sans)}
.reqlist .hid .t{letter-spacing:.12em;opacity:.65}
.reqlist .flip{animation:flip .5s}
.req .chip{font-size:15px;padding:4px 12px}
.stamp{position:absolute;right:14px;bottom:12px;transform:rotate(-10deg);border:3px double var(--lac);color:var(--lac);
  font:700 24px var(--serif);padding:4px 14px;border-radius:6px;opacity:0;pointer-events:none;background:rgba(238,231,213,.85)}
.stamp.show{animation:stamp .32s cubic-bezier(.2,.9,.3,1.2) forwards}
.stamp.gone{border-color:#5b5346;color:#5b5346}
@keyframes stamp{0%{opacity:0;transform:rotate(-10deg) scale(2.4)}100%{opacity:.95;transform:rotate(-10deg) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.msg{margin:0 14px 12px;padding:10px 12px;border-radius:10px;background:rgba(169,214,192,.08);border-left:3px solid var(--jade);min-height:46px;font-size:15px}
.msg.bad{border-left-color:var(--lac);background:rgba(179,40,60,.12)}
.msg.ok{border-left-color:#7fd0a0}
.next{margin:0 14px 14px;width:calc(100% - 28px)}

/* меню чаїв */
.tray-head{display:flex;align-items:baseline;justify-content:space-between;padding:6px 14px 4px}
.tray-head h2{font:700 20px var(--serif);margin:0}
.toggle{font-size:14px;color:var(--dim);display:flex;align-items:center;gap:6px}
.toggle input{width:18px;height:18px;accent-color:var(--jade)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:6px 14px 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.fchip.on{background:var(--jade);color:#0d2226;border-color:var(--jade);font-weight:600}
.search{display:block;width:calc(100% - 28px);margin:0 14px 10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--text);font:inherit}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.empty{grid-column:1/-1;color:var(--dim);text-align:center}

/* картка чаю */
.card{position:relative;min-height:124px;text-align:left;border-radius:12px;border:1.5px solid var(--tb,#5a8a86);
  background:linear-gradient(160deg,var(--ts,#1d4147),var(--bg2));color:var(--text);padding:30px 10px 28px;
  display:flex;flex-direction:column;justify-content:center;gap:4px;cursor:pointer}
.cname{font:600 15px/1.2 var(--serif);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{font-size:12px;color:var(--dim)}
.cdesc{font-size:12px;color:var(--jade)}
.pip{position:absolute;left:8px;top:6px;font-size:16px;line-height:1}
.pip.p2{left:auto;top:auto;right:8px;bottom:6px;transform:rotate(180deg)}
.card.tried{opacity:.42}
.card.tried::after{content:"✕";position:absolute;right:10px;top:4px;font-size:20px;color:var(--lac)}

/* шторка */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(4,12,14,.72)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;
  background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{position:relative;padding:16px 60px 8px 16px}
.sheet-kicker{font-size:13px;color:var(--jade);margin:0 0 2px}
.sheet-title{font:700 22px/1.2 var(--serif);margin:0}
.need{margin-top:10px;padding:8px 10px;border-radius:10px;background:rgba(238,231,213,.08)}
.need small{display:block;color:var(--dim);margin-bottom:5px}
.need .chip{font-size:13px}
.sheet-body{overflow:auto;padding:4px 16px 12px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1;padding:12px}
.props{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0}
.props dt{color:var(--dim)}
.props dd{margin:0}
.quote{margin:12px 0;padding:8px 12px;border-left:3px solid var(--jade);font-family:var(--serif);font-style:italic}
.about h3{font:700 17px var(--serif);margin:16px 0 4px}
.about p{margin:0 0 10px;max-width:70ch}
.howto{padding-left:20px;margin:6px 0 0}
.howto li{margin:0 0 10px}

/* підсумок */
.over{padding:48px 22px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.over h2{font:700 34px/1.1 var(--serif);margin:0;text-align:center}
.stats{display:grid;grid-template-columns:1fr auto;gap:8px 12px;background:rgba(169,214,192,.07);border-radius:12px;padding:14px 16px;margin:0}
.stats dt{color:var(--dim)}
.stats dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.dex-head{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 14px 6px}
.dex-head h2{font:700 24px var(--serif);margin:0;flex:1}


/* категорії й міні-картки */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
@media(min-width:520px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{display:flex;align-items:center;gap:10px;min-height:66px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--tb);
  background:linear-gradient(160deg,var(--ts),var(--bg2));color:var(--text);text-align:left;cursor:pointer}
.cat-g{font-size:26px;line-height:1}
.cat-n{font:700 17px/1.2 var(--serif)}
.x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:18px;line-height:1;cursor:pointer}
.mini-list{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.mini{border:1.5px solid var(--tb);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(160deg,var(--ts),var(--bg2))}
.mini .n{font:600 15px/1.25 var(--serif)}
.mini .d{font-size:12px;color:var(--jade)}
.mini .acts{display:flex;gap:8px;margin-top:2px}
.mini.tried{opacity:.55}
.sm{flex:1;border-radius:9px;padding:9px 10px;font-weight:600;font-size:14px;border:1.5px solid var(--line);background:transparent;cursor:pointer}
.sm.go{background:var(--jade);color:#0d2226;border-color:var(--jade)}
.sm:disabled{opacity:.5;cursor:default}
.note{margin:6px 0 10px;padding:8px 10px;border-radius:10px;border-left:3px solid var(--lac);background:rgba(179,40,60,.16);font-size:14px}
/* критик */
.vip{display:inline-block;margin-top:4px;background:var(--lac);color:#fff;border-radius:999px;padding:0 10px;font:700 12px var(--sans)}
.visitor.vipcard{outline-color:#b9862c;box-shadow:0 0 0 2px rgba(185,134,44,.55),0 12px 26px rgba(0,0,0,.4)}
/* заварювання */
.brew{margin:6px 0}
.qbox{margin:0 0 16px}
.brew-q{margin:0 0 8px;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.opt{padding:12px 0;border:1.5px solid var(--line);border-radius:10px;background:transparent;font-weight:700;font-size:16px;cursor:pointer}
.opt.on{background:var(--jade);color:#0d2226;border-color:var(--jade)}
.res{margin:0 0 8px;padding:8px 10px;border-radius:10px;background:rgba(169,214,192,.08)}
.res.ok{border-left:3px solid #7fd0a0}
.res.bad{border-left:3px solid var(--lac)}
.total{font-weight:700;margin:12px 0 4px}


/* міні-ігри */
.mini-sub{margin:0 14px 10px;color:var(--dim)}
.mgtiles{display:flex;flex-direction:column;gap:10px;padding:4px 14px calc(28px + env(safe-area-inset-bottom))}
.mgtile{display:flex;gap:14px;align-items:center;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:linear-gradient(160deg,#1b3d43,var(--bg2));color:var(--text);cursor:pointer}
.mgtile .g{font-size:32px;line-height:1}
.mgtile b{display:block;font:700 18px var(--serif)}
.mgtile small{display:block;color:var(--dim);line-height:1.35}
.mgtile .rec{color:var(--jade)}
.mg-title{font:700 17px var(--serif);flex:1;min-width:0}
.mg-rule{margin:14px 14px 6px;font-weight:600}
.mg-card{margin:8px 14px;padding:22px 16px;border-radius:16px;background:var(--paper);color:var(--ink);text-align:center;font:700 22px/1.25 var(--serif);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.mg-card.clues{text-align:left}
.mg-card .chip{--cbg:rgba(43,34,25,.07);--cbd:rgba(43,34,25,.4);--cfg:var(--ink);font-size:16px;font-family:var(--sans);font-weight:400}
.mg-infowrap{margin:0 14px 10px;display:flex;justify-content:center}
.mg-infowrap .sm{flex:none;padding:6px 18px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:0 14px}
.bin{padding:18px 10px;border-radius:12px;border:1.5px solid var(--line);background:rgba(169,214,192,.08);color:var(--text);font:600 16px var(--sans);cursor:pointer}
.bin.ok,.qopt.ok{background:#2d6a4a;border-color:#7fd0a0;color:#fff}
.bin.no,.qopt.no{background:#6b2232;border-color:var(--lac);color:#fff}
.mg-fb{margin:12px 14px;padding:10px 12px;border-radius:10px;border-left:3px solid var(--jade);background:rgba(169,214,192,.08);min-height:44px}
.mg-fb.ok{border-left-color:#7fd0a0}
.mg-fb.bad{border-left-color:var(--lac);background:rgba(179,40,60,.14)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.pcol{display:flex;flex-direction:column;gap:8px}
.olist{padding:0 14px}
.pbtn{padding:12px 10px;border-radius:10px;border:1.5px solid var(--line);background:rgba(169,214,192,.06);color:var(--text);text-align:left;font:15px/1.3 var(--sans);cursor:pointer}
.pbtn.sel{border-color:var(--jade);background:rgba(169,214,192,.22)}
.pbtn.done{opacity:.35;border-color:#7fd0a0}
.pbtn.bad{border-color:var(--lac);background:rgba(179,40,60,.25);animation:shake .35s}
.ladder{list-style:none;margin:10px 14px;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.ladder li{counter-increment:s;display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px;background:rgba(127,208,160,.14);border-left:3px solid #7fd0a0}
.ladder li::before{content:counter(s);font-weight:700;margin-right:10px;color:var(--jade)}
.ladder li span{flex:1}
.techcard{margin:10px 14px;padding:14px;border-radius:14px;background:var(--paper);color:var(--ink);border:2px dashed rgba(43,34,25,.5)}
.tc-k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.techcard h3{font:700 20px/1.2 var(--serif);margin:2px 0 2px}
.tc-sub{opacity:.75;margin-bottom:8px}
.tf{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(43,34,25,.15)}
.tf:last-child{border-bottom:0}
.tv{font-weight:600;text-align:right}
.tv.blank{letter-spacing:.2em;opacity:.55;border-bottom:2px dashed rgba(43,34,25,.6)}
.tv.good{color:#1f6b3f}
.tv.bad{color:#9b2237}
.tq{margin:12px 14px}
.qopts{display:flex;flex-wrap:wrap;gap:8px}
.qopt{padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--text);font:600 15px var(--sans);cursor:pointer}
.qopt.on{background:var(--jade);color:#0d2226;border-color:var(--jade)}
.qopt:disabled{cursor:default}
.qgrid{display:flex;flex-direction:column;gap:8px;padding:8px 14px}
.qopt.big{text-align:left;font-family:var(--serif);font-size:16px;font-weight:600;padding:14px}


/* навчання */
.known{color:var(--jade);font-weight:600}
.lcat{display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--tb);background:linear-gradient(160deg,var(--ts),var(--bg2));color:var(--text);cursor:pointer}
.lc-top{display:flex;align-items:center;gap:10px}
.lc-top .g{font-size:26px;line-height:1}
.lc-top b{font:700 18px var(--serif);flex:1}
.lcat small{color:var(--dim)}
.catbody{padding:6px 14px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.lhead{font:700 20px/1.25 var(--serif);margin:14px 14px 6px}
.catbody .lhead{margin:8px 0 0}
.lrow{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:rgba(169,214,192,.05);color:var(--text);cursor:pointer}
.lrow .mark{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.lrow.done .mark{background:#2d6a4a;border-color:#7fd0a0}
.lrow b{display:block;font:600 16px/1.25 var(--serif)}
.lrow small{color:var(--jade)}
.lrow div{flex:1;min-width:0}
.lrow .act{flex:none;font-size:13px;color:var(--dim)}
.lp{margin:10px 14px;font-size:17px;line-height:1.5;max-width:70ch}
.lp.tip{color:var(--jade);font-size:15px}
#lesson-body .chips{margin:6px 14px}
#lesson-body .chips.big .chip{font-size:17px;padding:5px 14px}
#lesson-body .props{margin:10px 14px}
#lesson-body .quote{margin:10px 14px}
.lfoot{display:flex;gap:10px;padding:8px 14px calc(24px + env(safe-area-inset-bottom))}
.lfoot .btn{flex:1}
.lfoot .btn[hidden]{display:none}
.ovl{margin:10px 14px;padding-left:20px}
.ovl li{margin:0 0 10px;font-size:16px;line-height:1.45}
.cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;margin:10px 14px;align-items:stretch}
.cmp .ch{font:700 14px/1.25 var(--serif);padding:6px 8px}
.cmp .ck{color:var(--dim);font-size:13px;padding:8px 0}
.cmp .cv{padding:8px;border-radius:8px;background:rgba(169,214,192,.05);font-size:14px;line-height:1.35}
.cmp .cv.diff{background:rgba(224,164,95,.22);border:1px solid rgba(224,164,95,.6)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<section id="scr-title" class="screen title-screen">
  <div class="fan" aria-hidden="true"></div>
  <div>
    <h1 data-t="title">Чайна зала</h1>
    <p class="tagline" data-t="tagline"></p>
  </div>
  <div class="menu-btns">
    <button class="btn" id="b-continue" data-t="btn_continue" hidden></button>
    <button class="btn" id="b-new" data-t="btn_new"></button>
    <button class="btn ghost" id="b-learn" data-t="btn_learn"></button>
    <button class="btn ghost" id="b-mini" data-t="btn_mini"></button>
    <button class="btn ghost" id="b-dex" data-t="btn_dex"></button>
    <button class="btn ghost" id="b-how" data-t="btn_how"></button>
  </div>
  <p class="best" id="best-line"></p>
</section>

<section id="scr-game" class="screen" hidden>
  <header class="hud">
    <div class="hud-row">
      <div class="hearts" id="hearts"></div>

<script src="teas.js"></script>
<script src="texts.js"></script>
<script>
(function(){
'use strict';

const CFG={PER_LEVEL:20,DIFF_EVERY:10,START:2,LIVES:5,PATIENCE:3,PERFECTS_FOR_LIFE:5,BREW_PTS:15,VIP_CHANCE:.12,VIP_FROM_TIER:3,VIP_PATIENCE:2};
const KEY='chaina-zala-save-v1',BEST='chaina-zala-best-v1',EASY='chaina-zala-easy-v1';

const STYLE={'Червоний':['❤️','#c4453a'],'Білий':['🤍','#d8d3c4'],'Зелений':['💚','#5fa86a'],'Жовтий':['💛','#dbb83f'],
  'Улун':['🪨','#c98544'],'Шу пуер':['🟤','#8a5f4b'],'Шен пуер':['🍃','#4f86ad'],'Хейча':['🪖','#8a68a3'],'GABA':['🌸','#c05f8b']};
const KIND_ICON={type:'🍃',region:'📍',novice:'🔰',char:'🎭',desc:'👅',time:'🕒',vessel:'🫖',temp:'🌡',pours:'🔁',pourtype:'💧'};
const KIND_ORDER=['novice','type','region','char','desc','time','vessel','temp','pours','pourtype'];
const NUMERIC=['temp','pours'];
const tx=(k,v)=>{const s=TX[k];if(s==null)return k;return v?s.replace(/\{(\w+)\}/g,(m,x)=>x in v?v[x]:m):s;};
const PEOPLE=[],SAY=[];
for(let i=1;TX['visitor_'+i+'_name'];i++)PEOPLE.push([TX['visitor_'+i+'_av']||'🙂',TX['visitor_'+i+'_name']]);
for(let i=1;TX['say_'+i];i++)SAY.push(TX['say_'+i]);
if(!PEOPLE.length)PEOPLE.push(['🙂','Гість']);
if(!SAY.length)SAY.push('');

const $=s=>document.querySelector(s);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';};
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
  del(k){try{localStorage.removeItem(k);}catch(e){}}
};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};

/* ---------- дані ---------- */
const BYID={};
TEAS.forEach(t=>{
  t.dl=t.desc.map(d=>d.toLowerCase());BYID[t.id]=t;
  const m=String(t.temp||'').match(/\d+/g);
  t.tlo=m?+m[0]:null;t.thi=m?+m[m.length-1]:null;
  t.pn=parseInt(t.infusions,10)||null;
});
const style=t=>STYLE[t.type]||['🍵','#7ba8a0'];

/* ---------- стан ---------- */
let S=null;
const menuSize=()=>Math.min(TEAS.length,CFG.START+Math.floor(S.served/CFG.PER_LEVEL));
const level=()=>1+Math.floor(S.served/CFG.PER_LEVEL);
const endless=()=>menuSize()>=TEAS.length;
const menuTeas=()=>S.order.slice(0,menuSize()).map(id=>BYID[id]);

function newOrder(){
  const o=shuffle(TEAS.map(t=>t.id));
  if(o.length>1&&BYID[o[0]].type===BYID[o[1]].type){
    const j=o.findIndex((id,i)=>i>1&&BYID[id].type!==BYID[o[0]].type);
    if(j>1){const x=o[1];o[1]=o[j];o[j]=x;}
  }
  return o;
}
function freshState(){return{order:newOrder(),served:0,lives:CFG.LIVES,score:0,streak:0,perfects:0,visitor:null,phase:'play',pendingUnlock:null,lastTea:null,brewed:false};}
function save(){
  store.set(KEY,{order:S.order,served:S.served,lives:S.lives,score:S.score,streak:S.streak,perfects:S.perfects});
  if(S.score>(store.get(BEST)||0))store.set(BEST,S.score);
}
function loadSave(){
  const d=store.get(KEY);
  if(!d||!Array.isArray(d.order)||!(d.lives>0))return null;
  const order=d.order.filter(id=>BYID[id]);
  TEAS.forEach(t=>{if(!order.includes(t.id))order.push(t.id);});
  return Object.assign(freshState(),d,{order,visitor:null,pendingUnlock:null,phase:'play',lastTea:null,brewed:false});
}

/* ---------- логіка гостей ---------- */
function fits(t,tr){
  switch(tr.k){
    case 'type':return t.type===tr.v;
    case 'region':return t.region===tr.v;
    case 'novice':return !!t.novice;
    case 'char':return t.char===tr.v;
    case 'desc':return t.dl.includes(tr.v);
    case 'time':return t.time==='Будь-який'||t.time===tr.v;
    case 'vessel':return t.vessels.includes(tr.v);
    case 'temp':return t.tlo!=null&&tr.v>=t.tlo&&tr.v<=t.thi;
    case 'pours':return t.pn!=null&&t.pn>=tr.v;
    case 'pourtype':return t.pour===tr.v;
  }
  return false;
}
const label=tr=>tr.k==='novice'?tx('label_novice'):tr.k==='desc'?cap(tr.v):
  tr.k==='temp'?tx('trait_temp',{v:tr.v}):tr.k==='pours'?tx('trait_pours',{v:tr.v}):tr.k==='pourtype'?tx('trait_pourtype',{v:tr.v}):tr.v;
const chipText=tr=>KIND_ICON[tr.k]+' '+label(tr);

function traitsOf(t){
  const a=[];
  if(t.type)a.push({k:'type',v:t.type});
  if(t.region)a.push({k:'region',v:t.region});
  if(t.novice)a.push({k:'novice',v:true});
  if(t.char)a.push({k:'char',v:t.char});
  t.dl.forEach(d=>a.push({k:'desc',v:d}));
  a.push({k:'time',v:t.time==='Будь-який'?pick(['Вечір','Ранок–День']):t.time});
  t.vessels.forEach(v=>a.push({k:'vessel',v}));
  if(t.tlo!=null){
    const opts=[...new Set([t.tlo,t.thi,Math.round((t.tlo+t.thi)/10)*5])].filter(x=>x>=t.tlo&&x<=t.thi);
    a.push({k:'temp',v:pick(opts)});
  }
  if(t.pn)a.push({k:'pours',v:Math.min(t.pn,Math.max(3,t.pn-pick([0,0,1,2])))});
  if(t.pour)a.push({k:'pourtype',v:t.pour});
  return a;
}
function weightedPick(items,w){
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<items.length;i++){r-=w[i];if(r<=0)return items[i];}
  return items[items.length-1];
}
function makeVisitor(){
  const menu=menuTeas(),L=1+Math.floor(S.served/CFG.DIFF_EVERY),target=pick(menu);
  const vip=L>=CFG.VIP_FROM_TIER&&Math.random()<CFG.VIP_CHANCE;
  let total=Math.min(5,1+Math.floor(L/4)+(Math.random()<.5?1:0));
  if(vip)total=Math.min(5,total+1);
  const cands=traitsOf(target),chosen=[];
  while(chosen.length<total){
    let pool=cands.filter(c=>!chosen.some(x=>x.k===c.k&&x.v===c.v)&&
      (c.k==='desc'?chosen.filter(x=>x.k==='desc').length<3:!chosen.some(x=>x.k===c.k)));
    if(!pool.length)break;
    if(chosen.length===0&&Math.random()<.5){const np=pool.filter(c=>NUMERIC.includes(c.k));if(np.length)pool=np;}
    const w=pool.map(c=>1+2*menu.filter(t=>!fits(t,c)).length);
    chosen.push(Object.assign({},weightedPick(pool,w)));
  }
  chosen.sort((a,b)=>KIND_ORDER.indexOf(a.k)-KIND_ORDER.indexOf(b.k));
  let hidCount=L<3?0:Math.floor((L-1)/6)+(Math.random()<.5?1:0);
  if(vip)hidCount++;
  hidCount=Math.min(chosen.length-1,3,hidCount);
  shuffle(chosen.map((_,i)=>i)).slice(0,hidCount).forEach(i=>{chosen[i].hidden=true;});
  const [av,name]=vip?[tx('vip_av'),tx('vip_name')]:pick(PEOPLE);
  const max=vip?CFG.VIP_PATIENCE:CFG.PATIENCE;
  return{av,name,say:tx('greeting'),vip,traits:chosen,max,patience:max,tried:new Set(),target:target.id};
}

/* ---------- екрани ---------- */
function show(id){
  ['title','game','dex','over','mini','mg','learn','cat','lesson'].forEach(n=>{$('#scr-'+n).hidden=(n!==id);});
  window.scrollTo(0,0);
}
function renderTitle(){
  const fan=$('.fan');fan.replaceChildren();
  shuffle(Object.keys(STYLE)).slice(0,3).forEach(k=>{
    const [g,c]=STYLE[k];
    const d=el('div','card');d.style.setProperty('--tb',c);d.style.setProperty('--ts',rgba(c,.28));
    d.append(el('span','pip',g),el('span','cname',k),el('span','pip p2',g));
    fan.append(d);
  });
  $('#b-continue').hidden=!loadSave();
  const b=store.get(BEST)||0;
  $('#best-line').textContent=b?tx('best_line',{n:b}):'';
  show('title');
}

function chipFor(tr){
  if(tr.hidden){const c=el('span','chip hid',KIND_ICON[tr.k]+' ???');c.setAttribute('aria-label',tx('aria_hidden'));return c;}
  const c=el('span','chip'+(tr.fresh?' flip':''),chipText(tr));tr.fresh=false;return c;
}
function renderHud(){
  const h=$('#hearts');h.replaceChildren();
  for(let i=0;i<CFG.LIVES;i++)h.append(el('span',i<S.lives?'':'lost',i<S.lives?'♥':'♡'));
  h.setAttribute('aria-label',tx('aria_lives',{n:S.lives,max:CFG.LIVES}));
  $('#score').textContent=S.score;
  $('#streak').textContent=S.streak>1?'🔥 '+S.streak:'';
  if(endless()){
    $('#bar').style.width='100%';
    $('#lvl').textContent=tx('lvl_endless');
    $('#prog').textContent=tx('prog_endless',{n:S.served});
  }else{
    const p=S.served%CFG.PER_LEVEL;
    $('#bar').style.width=(p/CFG.PER_LEVEL*100)+'%';
    $('#lvl').textContent=tx('lvl_normal',{level:level(),p:p,per:CFG.PER_LEVEL});
    $('#prog').textContent=tx('prog_normal',{m:menuSize(),total:TEAS.length});
  }
}
function renderVisitor(){
  const v=S.visitor,box=$('#visitor');box.replaceChildren();
  box.className='visitor'+(v.vip?' vipcard':'');
  const top=el('div','v-top');
  const nm=el('div','v-name');nm.append(el('b','',v.name),el('span','v-say',v.say));
  if(v.vip)nm.append(el('span','vip',tx('vip_badge')));
  const cups=el('div','cups');
  for(let i=0;i<v.max;i++)cups.append(el('span',i<v.patience?'':'lost','☕'));
  cups.setAttribute('aria-label',tx('aria_patience',{n:v.patience,max:v.max}));
  top.append(el('span','v-av',v.av),nm,cups);
  const req=el('ol','reqlist');
  v.traits.forEach((tr,i)=>{
    const li=el('li',tr.hidden?'hid':'');
    li.append(el('span','n',String(i+1)),el('span'+'','t'+(tr.fresh?' flip':''),tr.hidden?KIND_ICON[tr.k]+' ???':chipText(tr)));
    if(tr.hidden)li.setAttribute('aria-label',tx('aria_hidden'));
    tr.fresh=false;req.append(li);
  });
  const stamp=el('div','stamp');stamp.id='stamp';
  box.append(top,req,stamp);
}
function setMsg(text,cls){
  const m=$('#msg');m.textContent=text;m.className='msg'+(cls?' '+cls:'');
}
function renderNext(){
  const b=$('#b-next');
  b.hidden=!(S.phase==='won'||S.phase==='lost'||S.phase==='over');
  b.textContent=S.phase==='over'?tx('btn_summary'):tx('btn_next');
  const bb=$('#b-brew'),t=S.lastTea;
  bb.hidden=!(S.phase==='won'&&!S.brewed&&t&&(t.tlo!=null||t.pn));
}

/* ---------- категорії чаїв ---------- */
function typeList(){
  const known=Object.keys(STYLE).filter(k=>TEAS.some(t=>t.type===k));
  const extra=[...new Set(TEAS.map(t=>t.type))].filter(k=>!STYLE[k]);
  return known.concat(extra);
}
function buildCats(root,mode){
  root.replaceChildren();
  const grid=el('div','cats');
  typeList().forEach(type=>{
    const [g,c]=STYLE[type]||['🍵','#7ba8a0'];
    const b=el('button','cat');b.type='button';
    b.style.setProperty('--tb',rgba(c,.8));b.style.setProperty('--ts',rgba(c,.26));
    b.append(el('span','cat-g',g),el('span','cat-n',type));
    b.onclick=()=>openCategory(type,mode);
    grid.append(b);
  });
  root.append(grid);
}

/* ---------- шторка ---------- */
let sheetClose=null;
function showSheet(o){
  const head=$('#sheet-head'),body=$('#sheet-body'),foot=$('#sheet-foot');
  head.replaceChildren();body.replaceChildren();foot.replaceChildren();
  const x=el('button','x','✕');x.type='button';x.setAttribute('aria-label',tx('btn_close'));x.onclick=()=>closeSheet();
  head.append(x);
  if(o.kicker)head.append(el('p','sheet-kicker',o.kicker));
  const h=el('h2','sheet-title',o.title);h.id='sheet-title';head.append(h);
  if(o.need){
    const n=el('div','need');n.append(el('small','',tx('need_label')));
    const cs=el('div','chips');o.need.traits.forEach(tr=>cs.append(chipFor(tr)));
    n.append(cs);head.append(n);
  }
  if(o.note)body.append(el('p','note',o.note));
  body.append(o.body);
  (o.actions||[]).forEach(a=>{
    const b=el('button',a.cls||'btn',a.label);b.type='button';b.disabled=!!a.disabled;b.onclick=()=>a.fn();foot.append(b);
  });
  foot.hidden=!(o.actions&&o.actions.length);
  $('#sheet').hidden=false;document.body.classList.add('lock');
  body.scrollTop=0;sheetClose=o.onClose||null;
  const first=foot.querySelector('button:not(:disabled)')||x;first.focus({preventScroll:true});
}
function closeSheet(skipCallback){
  if($('#sheet').hidden)return;
  $('#sheet').hidden=true;document.body.classList.remove('lock');
  const cb=sheetClose;sheetClose=null;if(cb&&skipCallback!==true)cb();
}
function detailsNode(t){
  const f=document.createDocumentFragment();
  const chips=el('div','chips');
  [t.type,t.region,t.novice?tx('label_novice'):'',t.char].filter(Boolean).forEach(x=>chips.append(el('span','chip',x)));
  f.append(chips);
  if(t.desc.length){const d=el('div','chips');d.style.marginTop='8px';t.desc.forEach(x=>d.append(el('span','chip',cap(x))));f.append(d);}
  const dl=el('dl','props');
  [[tx('prop_time'),t.time],[tx('prop_vessel'),t.vessels.join(', ')],[tx('prop_weight'),t.weight],[tx('prop_temp'),t.temp],[tx('prop_infusions'),t.infusions],[tx('prop_pour'),t.pour]]
    .forEach(([k,v])=>{if(v){dl.append(el('dt','',k),el('dd','',v));}});
  f.append(dl);
  if(t.comment)f.append(el('blockquote','quote',t.comment));
  if(t.about){const a=el('div','about');a.append(el('h3','',tx('about_h')),el('p','',t.about));f.append(a);}
  return f;
}
/* інфо про чай: «Подати» і «Закрити» */
function openTea(t,o){
  o=o||{};
  const canServe=!!(o.serve&&S&&S.phase==='play'&&S.visitor);
  const tried=canServe&&S.visitor.tried.has(t.id);
  const actions=[];
  if(canServe)actions.push({label:tried?tx('btn_tried'):tx('btn_serve'),disabled:tried,fn:()=>{
    closeSheet(true);
    const r=serveTea(t);
    if(r&&r.wrong&&o.back)o.back(r.msg);
  }});
  actions.push({label:tx('btn_close'),cls:'btn ghost',fn:()=>closeSheet()});
  showSheet({kicker:o.title||'',title:t.name,need:canServe?S.visitor:null,body:detailsNode(t),actions,onClose:o.onClose});
}
/* категорія: маленькі картки з назвами, «Подати», «Інфо» і ✕ */
function openCategory(type,mode,note){
  const serve=!!(mode==='serve'&&S&&S.phase==='play'&&S.visitor);
  const src=mode==='serve'?menuTeas():TEAS;
  const teas=src.filter(t=>t.type===type).sort((a,b)=>a.name.localeCompare(b.name,'uk'));
  const [g,c]=STYLE[type]||['🍵','#7ba8a0'];
  const list=el('div','mini-list');
  if(!teas.length)list.append(el('p','empty',tx('cat_empty')));
  teas.forEach(t=>{
    const tried=serve&&S.visitor.tried.has(t.id);
    const m=el('div','mini'+(tried?' tried':''));
    m.style.setProperty('--tb',rgba(c,.75));m.style.setProperty('--ts',rgba(c,.2));
    m.append(el('div','n',t.name));
    if((easy||mode==='view')&&t.desc.length)m.append(el('div','d',t.desc.slice(0,3).map(cap).join(', ')));
    const acts=el('div','acts');
    if(serve){
      const b=el('button','sm go',tried?tx('btn_tried_short'):tx('btn_serve'));b.type='button';b.disabled=tried;
      b.onclick=()=>{closeSheet(true);const r=serveTea(t);if(r&&r.wrong)openCategory(type,mode,r.msg);};
      acts.append(b);
    }
    const i=el('button','sm',tx('btn_info'));i.type='button';
    i.onclick=()=>openTea(t,{serve,onClose:()=>openCategory(type,mode),back:n=>openCategory(type,mode,n)});
    acts.append(i);
    m.append(acts);list.append(m);
  });
  showSheet({kicker:g,title:type,need:serve?S.visitor:null,note,body:list,actions:[]});
}

/* ---------- гра ---------- */
let easy=!!store.get(EASY);
function buildTray(){buildCats($('#tray'),'serve');}
function startGame(st){
  S=st;
  show('game');$('#easy').checked=easy;
  buildTray();nextVisitor();
}
function nextVisitor(){
  if(S.lives<=0)return gameOver();
  S.visitor=makeVisitor();S.phase='play';S.lastTea=null;S.brewed=false;
  renderHud();renderVisitor();renderNext();
  setMsg(tx(S.visitor.vip?'msg_vip':'msg_start'));
  window.scrollTo(0,0);
}
function stampShow(text,gone){
  const s=$('#stamp');if(!s)return;
  s.textContent=text;s.className='stamp'+(gone?' gone':'');void s.offsetWidth;s.classList.add('show');
}
function serveTea(t){
  const v=S.visitor;
  if(S.phase!=='play'||v.tried.has(t.id))return null;
  v.tried.add(t.id);
  const fails=v.traits.filter(tr=>!fits(t,tr));
  if(!fails.length){win(t);return{win:true};}
  v.patience--;buzz(40);
  if(v.patience<=0){lose();return{lost:true};}
  const failVisible=fails.filter(f=>!f.hidden),failHidden=fails.filter(f=>f.hidden),hid=v.traits.filter(x=>x.hidden);
  let rev=null;
  if(hid.length){rev=failHidden.length?pick(failHidden):pick(hid);rev.hidden=false;rev.fresh=true;}
  const parts=[tx('msg_wrong',{tea:t.name})];
  if(failVisible.length)parts.push(tx('msg_mismatch',{list:failVisible.map(chipText).join(', ')}));
  if(rev)parts.push(tx('msg_revealed',{trait:chipText(rev)}));
  const msg=parts.join(' ');
  renderVisitor();renderHud();setMsg(msg,'bad');
  $('#visitor').classList.remove('shake');void $('#visitor').offsetWidth;$('#visitor').classList.add('shake');
  return{wrong:true,msg};
}
function win(t){
  const v=S.visitor,perfect=v.patience===v.max;
  S.streak=perfect?S.streak+1:0;
  if(perfect)S.perfects++;
  const pts=(v.patience*10+v.traits.length*5+Math.min(S.streak,10)*3)*(v.vip?2:1);
  S.score+=pts;
  let extra=false;
  if(perfect&&S.perfects%CFG.PERFECTS_FOR_LIFE===0&&S.lives<CFG.LIVES){S.lives++;extra=true;}
  const before=menuSize();S.served++;const after=menuSize();
  if(after>before)S.pendingUnlock=BYID[S.order[after-1]];
  v.traits.forEach(tr=>{tr.hidden=false;});
  S.phase='won';S.lastTea=t;S.brewed=false;buzz(20);
  renderVisitor();stampShow(tx('stamp_win'));renderHud();renderNext();
  setMsg([tx('msg_win',{tea:t.name,pts:pts}),perfect?tx('msg_perfect'):'',extra?tx('msg_life'):''].filter(Boolean).join(' '),'ok');
  save();
}
function lose(){
  const v=S.visitor;
  S.lives--;S.streak=0;
  v.traits.forEach(tr=>{tr.hidden=false;});
  const ok=menuTeas().filter(t=>v.traits.every(tr=>fits(t,tr)));
  S.phase=S.lives>0?'lost':'over';
  renderVisitor();stampShow(tx('stamp_lose'),true);renderHud();renderNext();
  setMsg(tx('msg_lose',{tea:(ok[0]||BYID[v.target]).name}),'bad');
  $('#visitor').classList.add('shake');buzz(120);
  save();
}

function openBrew(){
  const t=S.lastTea;
  if(!t||S.brewed||S.phase!=='won')return;
  const ans={},keys=[];
  const body=el('div','brew');
  function group(key,q,values,fmt){
    keys.push(key);
    const box=el('div','qbox');box.append(el('p','brew-q',q));
    const row=el('div','opts');
    values.forEach(v=>{
      const b=el('button','opt',fmt(v));b.type='button';
      b.onclick=()=>{
        ans[key]=v;[...row.children].forEach(x=>x.classList.toggle('on',x===b));
        if(keys.every(k=>ans[k]!=null))finishBrew(t,ans);
      };
      row.append(b);
    });
    box.append(row);body.append(box);
  }
  if(t.tlo!=null)group('temp',tx('brew_q_temp'),[80,85,90,95,100],v=>v+'°C');
  if(t.pn){const start=Math.max(1,t.pn-rnd(5));group('pours',tx('brew_q_pours'),[0,1,2,3,4].map(i=>start+i),v=>String(v));}
  showSheet({title:tx('brew_title',{tea:t.name}),body,actions:[{label:tx('btn_skip'),cls:'btn ghost',fn:()=>closeSheet()}]});
}
function finishBrew(t,ans){
  let pts=0;const body=el('div','brew');
  const line=(ok,text)=>{const p=el('p','res '+(ok?'ok':'bad'),(ok?'✓ ':'✕ ')+text);body.append(p);};
  if(ans.temp!=null){
    const ok=ans.temp>=t.tlo&&ans.temp<=t.thi;if(ok)pts+=CFG.BREW_PTS;
    line(ok,tx(ok?'brew_temp_ok':'brew_temp_bad',{v:ans.temp,range:t.temp}));
  }
  if(ans.pours!=null){
    const d=Math.abs(ans.pours-t.pn),ok=d===0,near=d===1;
    pts+=ok?CFG.BREW_PTS:near?Math.floor(CFG.BREW_PTS/2):0;
    line(ok||near,tx(ok?'brew_pours_ok':near?'brew_pours_near':'brew_pours_bad',{v:ans.pours,n:t.pn}));
  }
  S.brewed=true;S.score+=pts;renderHud();renderNext();save();
  body.append(el('p','total',tx('brew_total',{pts})));
  showSheet({title:tx('brew_title',{tea:t.name}),body,actions:[{label:tx('btn_ok'),fn:()=>closeSheet()}]});
}
function onNext(){
  if(S.phase==='over')return gameOver();
  if(S.pendingUnlock){
    S.pendingUnlock=null;buildTray();
    const last=endless();
    const p=el('p','',tx(last?'unlock_last_body':'unlock_new_body'));
    showSheet({title:tx(last?'unlock_last_title':'unlock_new_title'),body:p,
      actions:[{label:tx('btn_to_guests'),fn:()=>closeSheet()}],onClose:()=>nextVisitor()});
    return;
  }

}

/* --- 1. Сортування --- */
const sortRule={
  type:()=>({bins:typeList().map(x=>({k:x,l:x})),of:t=>t.type,has:t=>!!t.type,pick:3}),
  region:()=>({bins:[...new Set(TEAS.map(t=>t.region))].filter(Boolean).map(x=>({k:x,l:x})),of:t=>t.region,has:t=>!!t.region,pick:3}),
  char:()=>({bins:[{k:'Інтроверт',l:'Інтроверт'},{k:'Екстраверт',l:'Екстраверт'}],of:t=>t.char,has:t=>!!t.char}),
  novice:()=>({bins:[{k:'y',l:tx('bin_novice_yes')},{k:'n',l:tx('bin_novice_no')}],of:t=>t.novice?'y':'n',has:()=>true}),
  time:()=>({bins:['Вечір','Ранок–День','Будь-який'].map(x=>({k:x,l:x})),of:t=>t.time,has:t=>!!t.time}),
  pour:()=>({bins:['Швидкий','Нормальний','Повільний'].map(x=>({k:x,l:x})),of:t=>t.pour,has:t=>!!t.pour}),
  temp:()=>({bins:[{k:'lo',l:tx('bin_temp_low')},{k:'hi',l:tx('bin_temp_high')}],of:t=>t.tlo<90?'lo':'hi',has:t=>t.tlo!=null}),
  pours:()=>({bins:[{k:'lo',l:tx('bin_pours_low')},{k:'hi',l:tx('bin_pours_high')}],of:t=>t.pn<=6?'lo':'hi',has:t=>t.pn!=null})
};
function sortStage(prev){
  for(const name of shuffle(Object.keys(sortRule).filter(k=>k!==prev))){
    const r=sortRule[name](),pool=TEAS.filter(r.has);
    let bins=r.bins.filter(b=>pool.filter(t=>r.of(t)===b.k).length>=2);
    if(r.pick)bins=shuffle(bins).slice(0,r.pick);
    if(bins.length<2)continue;
    const keys=new Set(bins.map(b=>b.k));
    const cards=shuffle(pool.filter(t=>keys.has(r.of(t)))).slice(0,5);
    if(cards.length<5||new Set(cards.map(r.of)).size<2)continue;
    return{name,bins,of:r.of,cards};
  }
  return null;
}

const MATCH_MODES={

function matchBoard(prev){

  shuffle(TEAS).forEach(t=>{const k=M.key(t);if(k!=null&&!seen.has(k)&&teas.length<5){seen.add(k);teas.push(t);}});

}

  temp:{lab:'prop_temp',val:t=>t.tlo!=null?t.temp:null,pool:()=>uniq(t=>t.tlo!=null?t.temp:null)},
  infusions:{lab:'prop_infusions',val:t=>t.pn?String(t.pn):null,pool:()=>[]},

  vessel:{lab:'prop_vessel',val:t=>t.vessels.length?t.vessels.join(', '):null,pool:()=>uniq(t=>t.vessels.length?t.vessels.join(', '):null)},
  time:{lab:'prop_time',val:t=>t.time||null,pool:()=>['Вечір','Ранок–День','Будь-який']}

const TECH_ORDER=['weight','temp','infusions','pour','vessel','time'];
function techOpts(k,t){
  const ans=TECH[k].val(t);let pool;
  if(k==='infusions'){const n=t.pn;pool=[n-3,n-2,n-1,n+1,n+2,n+3].filter(x=>x>=3).map(String);}
  else pool=TECH[k].pool().filter(x=>x!==ans);
  return shuffle([ans].concat(shuffle(pool).slice(0,Math.min(3,pool.length))));
}

/* --- 4. Зайвий чай --- */
function oddProps(t){
  const a=[];
  if(t.type)a.push(['type',t.type]);
  if(t.region)a.push(['region',t.region]);
  if(t.char)a.push(['char',t.char]);
  if(t.novice)a.push(['novice','y']);
  t.dl.forEach(d=>a.push(['desc',d]));
  if(t.pour)a.push(['pour',t.pour]);
  if(t.time)a.push(['time',t.time]);
  return a;
}
const oddText=p=>tx('odd_'+p[0],{v:p[0]==='desc'?cap(p[1]):p[1]});
function oddQuestion(){
  for(let tries=0;tries<300;tries++){
    const p=pick(oddProps(pick(TEAS))),k=p[0]+'|'+p[1];
    const withP=TEAS.filter(t=>t._pk.has(k)),without=TEAS.filter(t=>!t._pk.has(k));
    if(withP.length<3||!without.length)continue;
    const three=shuffle(withP).slice(0,3),odd=pick(without),four=three.concat([odd]);
    const cnt={};four.forEach(t=>t._pk.forEach(x=>{cnt[x]=(cnt[x]||0)+1;}));
    let amb=false;
    for(const x in cnt){if(cnt[x]===3&&x!==k&&four.find(t=>!t._pk.has(x))!==odd){amb=true;break;}}
    if(amb)continue;
    return{p,three,odd,four:shuffle(four)};
  }
  const p=['type',TEAS[0].type],three=TEAS.filter(t=>t.type===TEAS[0].type).slice(0,3),odd=TEAS.find(t=>t.type!==TEAS[0].type);
  return{p,three,odd,four:three.concat([odd])};
}
function oddNext(){
  const Q=oddQuestion();MG.q=Q;
  const body=mgBody();body.replaceChildren();
  body.append(el('p','mg-rule',tx('mg_odd_q')));
  const grid=el('div','qgrid'),fb=mgFb('');fb.hidden=true;
  Q.four.forEach(t=>{
    const b=el('button','qopt big',t.name);b.type='button';b.dataset.id=t.id;
    b.onclick=()=>{
      if(MG.busy)return;MG.busy=true;
      const right=t===Q.odd;b.classList.add(right?'ok':'no');
      [...grid.children].forEach(x=>{if(x.dataset.id===Q.odd.id)x.classList.add('ok');x.disabled=true;});
      if(right){mgAdd(streakPts());MG.streak++;}else{MG.mist++;MG.streak=0;}
      fb.hidden=false;fb.className='mg-fb '+(right?'ok':'bad');
      fb.textContent=(right?tx('mg_right')+' ':tx('mg_wrong')+' ')+tx('mg_odd_common',{what:oddText(Q.p),tea:Q.odd.name});
      mgNext(body);
    };
    grid.append(b);
  });
  body.append(grid,fb);
}

/* --- 5. Вгадай чай --- */
function guessQuestion(){
  for(let tries=0;tries<200;tries++){
    const target=pick(TEAS),clues=shuffle(traitsOf(target)).slice(0,3);

    if(others.length<3)continue;
    return{target,clues,options:shuffle([target].concat(shuffle(others).slice(0,3)))};
  }
}

/* --- конструктор запитань --- */
function mkOpts(correct,pool,n){
  n=n||4;const c=String(correct);
  const ds=shuffle([...new Set(pool.map(String))].filter(x=>x!==c)).slice(0,n-1);
  return shuffle([{l:c,ok:true}].concat(ds.map(x=>({l:x,ok:false}))));
}
const qRegion=t=>t.region?{text:tx('q_region',{tea:t.name}),opts:mkOpts(t.region,uniq(x=>x.region))}:null;
const qChar=t=>t.char?{text:tx('q_char',{tea:t.name}),opts:mkOpts(t.char,['Інтроверт','Екстраверт'],2)}:null;
function qTaste(t){
  if(!t.desc.length)return null;
  const pool=allDesc().filter(x=>!t.dl.includes(x.toLowerCase()));
  return{text:tx('q_taste',{tea:t.name}),opts:mkOpts(cap(pick(t.desc)),pool)};
}
const qTemp=t=>t.tlo!=null?{text:tx('q_temp',{tea:t.name}),opts:mkOpts(t.temp,uniq(x=>x.tlo!=null?x.temp:null))}:null;
function qPours(t){
  if(!t.pn)return null;
  const n=t.pn;return{text:tx('q_pours',{tea:t.name}),opts:mkOpts(n,[n-3,n-2,n-1,n+1,n+2,n+3].filter(x=>x>=3))};
}
const qPour=t=>t.pour?{text:tx('q_pour',{tea:t.name}),opts:mkOpts(t.pour,['Швидкий','Нормальний','Повільний'],3)}:null;
const qVessel=t=>t.vessels.length?{text:tx('q_vessel',{tea:t.name}),opts:mkOpts(t.vessels.join(', '),uniq(x=>x.vessels.length?x.vessels.join(', '):null))}:null;
const qTime=t=>t.time?{text:tx('q_time',{tea:t.name}),opts:mkOpts(t.time,['Вечір','Ранок–День','Будь-який'],3)}:null;
const qNovice=t=>({text:tx('q_novice',{tea:t.name}),opts:[{l:tx('ans_yes'),ok:!!t.novice},{l:tx('ans_no'),ok:!t.novice}]});

function diffFacts(a,b){
  const f=[];
  a.desc.forEach(d=>{if(!b.dl.includes(d.toLowerCase()))f.push({k:'desc',v:cap(d)});});
  if(a.region&&a.region!==b.region)f.push({k:'region',v:a.region});
  if(a.char&&a.char!==b.char)f.push({k:'char',v:a.char});
  if(a.tlo!=null&&a.temp!==b.temp)f.push({k:'temp',v:a.temp});
  if(a.pn&&a.pn!==b.pn)f.push({k:'pours',v:a.pn});
  if(a.pour&&a.pour!==b.pour)f.push({k:'pour',v:a.pour});
  if(!!a.novice!==!!b.novice)f.push({k:'novice',v:a.novice?'yes':'no'});
  return f;
}
const factText=f=>tx('diff_'+f.k+(f.k==='novice'?'_'+f.v:''),{v:f.v});
function qDiff(a,b){
  const good=diffFacts(a,b);
  if(!good.length)return null;
  const correct=pick(good),ct=factText(correct);
  let bad=diffFacts(b,a);
  shuffle(TEAS.filter(x=>x!==a&&x!==b)).slice(0,8).forEach(c=>{bad=bad.concat(diffFacts(c,a));});
  const texts=[...new Set(bad.map(factText))].filter(x=>x!==ct);
  if(texts.length<2)return null;
  const opts=shuffle([{l:ct,ok:true}].concat(shuffle(texts).slice(0,3).map(x=>({l:x,ok:false}))));
  return{text:tx('q_diff',{a:a.name,b:b.name}),opts};
}
function groupGuess(g){
  for(let n=0;n<40;n++){
    const target=pick(g),opts=shuffle([target].concat(shuffle(g.filter(x=>x!==target)).slice(0,3)));
    const clues=[];
    for(const c of shuffle(traitsOf(target))){
      clues.push(c);
      if(opts.filter(t=>clues.every(k=>fits(t,k))).length===1||clues.length>=4)break;
    }
    if(opts.filter(t=>clues.every(k=>fits(t,k))).length!==1)continue;
    return{text:tx('exam_guess'),chips:clues.map(chipText),opts:opts.map(t=>({l:t.name,ok:t===target}))};
  }
  return null;
}

function pitchParts(t){

function teaSteps(t){

  if(t.about)S.push(readStep(tx('page_story'),b=>{b.append(el('p','lp',t.about));}));
  S.push(readStep(tx('page_pitch'),b=>{
    pitchParts(t).forEach(x=>b.append(el('p','lp',x)));
    b.append(el('p','lp tip',tx('pitch_hint')));
  }));
  const reads=S.length;
  const fields=[];
  if(t.region)fields.push({label:tx('f_region'),opts:mkOpts(t.region,uniq(x=>x.region))});
  if(t.desc.length)fields.push({label:tx('f_taste'),opts:mkOpts(cap(pick(t.desc)),allDesc().filter(x=>!t.dl.includes(x.toLowerCase())))});
  if(t.tlo!=null)fields.push({label:tx('prop_temp'),opts:mkOpts(t.temp,uniq(x=>x.tlo!=null?x.temp:null))});
  if(t.pn)fields.push({label:tx('prop_infusions'),opts:mkOpts(t.pn,[t.pn-3,t.pn-2,t.pn-1,t.pn+1,t.pn+2,t.pn+3].filter(x=>x>=3))});

function startCompare(type){
  const g=groupOf(type),pairs=[];
  const all=[];g.forEach((a,i)=>g.slice(i+1).forEach(b=>{if(diffFacts(a,b).length&&diffFacts(b,a).length)all.push([a,b]);}));
  shuffle(all).slice(0,3).forEach(p=>pairs.push(p));

  pairs.forEach(([a,b])=>{
    S.push(cmpPage(a,b));
    const q1=qDiff(a,b),q2=qDiff(b,a);
    if(q1)S.push(qStep(q1,'quiz'));if(q2)S.push(qStep(q2,'quiz'));
  });
  lessonStart({title:tx('row_compare')+': '+type,steps:S,finish:L=>{
    if(passed(L.sec.quiz,.7)){const c=cprog(type);c.cmp=(c.cmp||0)+1;lsave();}
    lessonResult([[tx('lr_quiz'),frac(L.sec.quiz)]],()=>startCompare(type));
  }});
}

/* --- іспит категорії --- */
function startExam(type){
  const g=groupOf(type),N=8,S=[];
  for(let i=0;i<N;i++){
    let q=i%2===0?groupGuess(g):null;
    if(!q){const [a,b]=shuffle(g).slice(0,2);q=qDiff(a,b);}
    if(!q)q=groupGuess(g)||qRegion(pick(g));
    S.push(qStep(q,'exam'));
  }
  const need=Math.ceil(N*.75);
  lessonStart({title:tx('row_exam')+': '+type,steps:S,finish:L=>{
    const e=L.sec.exam||{ok:0,n:N},c=cprog(type);
    if(e.ok>(c.exam||0)){c.exam=e.ok;c.examN=e.n;}
    if(e.ok>=need)c.pass=true;
    lsave();
    lessonResult([[tx('row_exam'),e.ok+'/'+e.n],[tx('lr_verdict'),e.ok>=need?tx('lr_exam_pass'):tx('lr_exam_fail',{need,n:N})]],()=>startExam(type));
  }});
}

/* --- екрани навчання --- */
function openLearn(){
  const root=$('#learn-list');root.replaceChildren();
  $('#learn-known').textContent=tx('learn_known',{n:TEAS.filter(t=>tstars(t)===3).length,total:TEAS.length});
  typeList().forEach(type=>{
    const g=groupOf(type),[gl,c]=STYLE[type]||['🍵','#7ba8a0'];
    const st=g.reduce((a,t)=>a+tstars(t),0),max=g.length*3;
    const b=el('button','lcat');b.type='button';
    b.style.setProperty('--tb',rgba(c,.8));b.style.setProperty('--ts',rgba(c,.24));
    const top=el('div','lc-top');top.append(el('span','g',gl),el('b','',type),el('small','',tx('cat_teas',{n:g.length})));
    const bar=el('div','bar'),i=el('i');i.style.width=(max?st/max*100:0)+'%';bar.append(i);
    b.append(top,bar,el('small','',tx('learn_progress',{stars:st,max})));
    b.onclick=()=>openCat(type);root.append(b);
  });
  show('learn');
}
function openCat(type){
  curCat=type;
  const g=groupOf(type),[gl]=STYLE[type]||['🍵'];
  $('#cat-title').textContent=gl+' '+type;
  const root=$('#cat-body');root.replaceChildren();
  const c=cprog(type),rows=[];
  rows.push({title:tx('row_overview'),sub:tx('row_overview_sub'),done:!!c.intro,go:()=>startOverview(type)});
  g.forEach(t=>{const n=tstars(t);rows.push({title:t.name,sub:starStr(n),done:n===3,go:()=>startTea(t)});});
  if(g.length>=2){
    rows.push({title:tx('row_compare'),sub:tx('row_compare_sub'),done:(c.cmp||0)>0,go:()=>startCompare(type)});
    rows.push({title:tx('row_exam'),sub:c.exam!=null?tx('row_exam_best',{n:c.exam,total:c.examN||8}):tx('row_exam_sub'),done:!!c.pass,go:()=>startExam(type)});
  }
  const next=rows.find(r=>!r.done);
  if(next){const b=el('button','btn',tx('cat_continue')+': '+next.title);b.type='button';b.onclick=next.go;b.id='cat-continue';root.append(b);}
  root.append(el('h3','lhead',tx('cat_steps')));
  rows.forEach((r,i)=>{
    const b=el('button','lrow'+(r.done?' done':''));b.type='button';
    const info=el('div','');info.append(el('b','',r.title),el('small','',r.sub));
    b.append(el('span','mark',r.done?'✓':String(i+1)),info,el('span','act',r.done?tx('row_repeat'):tx('row_start')));
    b.onclick=r.go;root.append(b);
  });
  if(g.length<2)root.append(el('p','lp tip',tx('cat_single')));
  show('cat');
}
